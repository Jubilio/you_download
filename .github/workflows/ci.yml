name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Instala as dependências, mas omite o pywin32 por estar em Linux
        pip install -r requirements.txt

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Build React Frontend
      run: |
        cd frontend_react
        npm install
        npm run build

    - name: Basic syntax check (flake8)
      run: |
        pip install flake8
        # Ignora erros muito estritos, apenas verifica se há falhas fatais de sintaxe
        flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics
